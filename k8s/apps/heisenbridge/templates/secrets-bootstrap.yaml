apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretsBootstrap.secretName }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ .Values.secretsBootstrap.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretsBootstrap.secretName }}
    creationPolicy: Owner
    template:
      data:
        registration.yaml: |
          id: heisenbridge
          url: http://heisenbridge:9898
          as_token: {{ "{{ .AS_TOKEN }}" }}
          hs_token: {{ "{{ .HS_TOKEN }}" }}
          rate_limited: false
          sender_localpart: heisenbridge
          namespaces:
            users:
            - regex: '@irc_.*'
              exclusive: true
            aliases: []
            rooms: []
  data:
    - secretKey: AS_TOKEN
      remoteRef:
        key: AS_TOKEN
    - secretKey: HS_TOKEN
      remoteRef:
        key: HS_TOKEN
