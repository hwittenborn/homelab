apiVersion: apps/v1
kind: Deployment
metadata:
  name: heisenbridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heisenbridge
  template:
    metadata:
      labels:
        app: heisenbridge
    spec:
      initContainers:
        - name: copy-registration
          image: busybox:latest
          command:
            - sh
            - -c
            - cp /secret/registration.yaml /data/registration.yaml
          volumeMounts:
            - name: registration-secret
              mountPath: /secret
              readOnly: true
            - name: data
              mountPath: /data
      containers:
        - name: heisenbridge
          image: {{ .Values.heisenbridge.image }}
          args:
            - -c
            - /data/registration.yaml
            - -o
            - {{ .Values.heisenbridge.owner | quote }}
            - {{ .Values.heisenbridge.homeserverUrl | quote }}
          ports:
            - name: http
              containerPort: 9898
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: registration-secret
          secret:
            secretName: {{ .Values.secretsBootstrap.secretName }}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: heisenbridge
spec:
  type: ClusterIP
  selector:
    app: heisenbridge
  ports:
    - name: http
      port: 9898
      targetPort: http
