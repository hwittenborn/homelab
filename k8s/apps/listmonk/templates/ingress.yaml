{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: listmonk-private
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: {{ .Values.ingress.private.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.private.host }}
      secretName: {{ include "listmonk.privateTlsSecretName" . }}
  rules:
    - host: {{ .Values.ingress.private.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: listmonk
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: listmonk-public
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.public.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.public.host }}
      secretName: {{ include "listmonk.publicTlsSecretName" . }}
  rules:
    - host: {{ .Values.ingress.public.host }}
      http:
        paths:
{{- range .Values.ingress.public.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: listmonk
                port:
                  name: http
{{- end }}
{{- end }}
