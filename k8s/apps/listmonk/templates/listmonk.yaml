apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: listmonk-uploads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.listmonk.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: listmonk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listmonk
  template:
    metadata:
      labels:
        app: listmonk
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -ec
            - |
              until pg_isready -h postgres -p 5432 -U {{ .Values.postgres.user }} -d {{ .Values.postgres.db }}; do
                sleep 2
              done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "listmonk.secretName" . }}
                  key: POSTGRES_PASSWORD
        - name: install-upgrade
          image: {{ .Values.listmonk.image }}
          command:
            - sh
            - -ec
            - |
              ./listmonk --install --idempotent --yes --config ''
              ./listmonk --upgrade --yes --config ''
          env:
            - name: LISTMONK_app__address
              value: 0.0.0.0:9000
            - name: LISTMONK_db__host
              value: postgres
            - name: LISTMONK_db__port
              value: "5432"
            - name: LISTMONK_db__user
              value: {{ .Values.postgres.user | quote }}
            - name: LISTMONK_db__password
              valueFrom:
                secretKeyRef:
                  name: {{ include "listmonk.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: LISTMONK_db__database
              value: {{ .Values.postgres.db | quote }}
            - name: LISTMONK_db__ssl_mode
              value: disable
      containers:
        - name: listmonk
          image: {{ .Values.listmonk.image }}
          command:
            - ./listmonk
          args:
            - --config
            - ""
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: LISTMONK_app__address
              value: 0.0.0.0:9000
            - name: LISTMONK_db__host
              value: postgres
            - name: LISTMONK_db__port
              value: "5432"
            - name: LISTMONK_db__user
              value: {{ .Values.postgres.user | quote }}
            - name: LISTMONK_db__password
              valueFrom:
                secretKeyRef:
                  name: {{ include "listmonk.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: LISTMONK_db__database
              value: {{ .Values.postgres.db | quote }}
            - name: LISTMONK_db__ssl_mode
              value: disable
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.listmonk.resources | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.listmonk.uploadPath }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: listmonk-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: listmonk
spec:
  type: ClusterIP
  selector:
    app: listmonk
  ports:
    - name: http
      port: 9000
      targetPort: http
